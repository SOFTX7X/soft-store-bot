<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09070d">
  <title>Suporte | SOFT STORE</title>
  <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09070d;
      --surface: rgba(25, 19, 33, .9);
      --surface-2: rgba(38, 27, 50, .88);
      --text: #faf7ff;
      --muted: #b8abc5;
      --pink: #ff2aa1;
      --purple: #9147ff;
      --border: rgba(255, 255, 255, .1);
      --danger: #ff6b81;
      --success: #4ce0a1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      color: var(--text);
      font: 500 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 5%, rgba(255, 42, 161, .2), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(145, 71, 255, .18), transparent 35%),
        var(--bg);
    }

    main { width: min(100%, 520px); margin: 0 auto; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .mark {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 15px;
      background: linear-gradient(145deg, var(--pink), var(--purple));
      box-shadow: 0 12px 35px rgba(255, 42, 161, .22);
      font-size: 22px;
    }

    .brand strong { display: block; letter-spacing: .04em; }
    .brand span { color: var(--muted); font-size: 13px; }

    .card {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(160deg, var(--surface-2), var(--surface));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .36);
      backdrop-filter: blur(18px);
      animation: enter .42s ease-out both;
    }

    h1 { margin: 0 0 8px; font-size: clamp(25px, 7vw, 34px); line-height: 1.1; }
    .intro { margin: 0 0 24px; color: var(--muted); }

    label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 750; }

    select, input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: rgba(8, 6, 12, .7);
      color: var(--text);
      font: inherit;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }

    select, input { min-height: 52px; padding: 0 14px; }
    textarea { min-height: 145px; resize: vertical; padding: 14px; }
    select:focus, input:focus, textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 42, 161, .12);
    }

    .counter { margin-top: 6px; color: var(--muted); font-size: 12px; text-align: right; }

    button {
      position: relative;
      width: 100%;
      min-height: 56px;
      margin-top: 22px;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      color: white;
      background: linear-gradient(100deg, var(--pink), var(--purple));
      box-shadow: 0 14px 34px rgba(180, 46, 213, .28);
      font: 800 15px/1 system-ui, sans-serif;
      letter-spacing: .035em;
      cursor: pointer;
      transition: transform .16s ease, filter .2s ease, opacity .2s;
    }

    button::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-120%);
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.25), transparent 70%);
      animation: shine 3s ease-in-out infinite;
    }

    button:active { transform: scale(.985); }
    button:disabled { cursor: wait; opacity: .62; filter: grayscale(.2); }

    .status { display: none; margin-top: 16px; padding: 13px 14px; border-radius: 13px; font-size: 14px; }
    .status.error { display: block; color: #ffd7df; background: rgba(255, 107, 129, .13); border: 1px solid rgba(255, 107, 129, .3); }
    .status.success { display: block; color: #cffff0; background: rgba(76, 224, 161, .12); border: 1px solid rgba(76, 224, 161, .3); }
    .privacy { margin: 16px 4px 0; color: var(--muted); font-size: 12px; text-align: center; }

    @keyframes enter { from { opacity: 0; transform: translateY(14px); } }
    @keyframes shine { 0%, 55% { transform: translateX(-120%); } 80%, 100% { transform: translateX(120%); } }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark" aria-hidden="true">✦</div>
      <div><strong>SOFT STORE</strong><span>Atendimento oficial</span></div>
    </div>

    <section class="card">
      <h1>Como podemos ajudar?</h1>
      <p class="intro">Envie sua solicitação e acompanhe a resposta diretamente pelo bot.</p>

      <form id="support-form">
        <label for="category">Assunto</label>
        <select id="category" name="category" required>
          <option value="pagamento">Pagamento</option>
          <option value="entrega">Entrega do produto</option>
          <option value="produto">Dúvida sobre produto</option>
          <option value="outro">Outro assunto</option>
        </select>

        <label for="order">ID da transação <span style="color:var(--muted);font-weight:500">(opcional)</span></label>
        <input id="order" name="order" maxlength="80" placeholder="Ex.: tx_...">

        <label for="message">Descreva sua situação</label>
        <textarea id="message" name="message" minlength="10" maxlength="1500" required placeholder="Conte o que aconteceu com o máximo de detalhes..."></textarea>
        <div class="counter"><span id="count">0</span>/1500</div>

        <button id="submit" type="submit">ENVIAR ATENDIMENTO</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>
    <p class="privacy">Seus dados são usados somente para responder este atendimento.</p>
  </main>

  <script>
    const webApp = window.Telegram?.WebApp;
    const form = document.getElementById('support-form');
    const message = document.getElementById('message');
    const count = document.getElementById('count');
    const submit = document.getElementById('submit');
    const statusBox = document.getElementById('status');

    webApp?.ready();
    webApp?.expand();
    webApp?.setHeaderColor?.('#09070d');
    webApp?.setBackgroundColor?.('#09070d');

    message.addEventListener('input', () => { count.textContent = message.value.length; });

    function showStatus(text, type) {
      statusBox.textContent = text;
      statusBox.className = `status ${type}`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!webApp?.initData) {
        showStatus('Abra este formulário pelo botão Suporte dentro do Telegram.', 'error');
        return;
      }

      submit.disabled = true;
      submit.textContent = 'ENVIANDO...';
      statusBox.className = 'status';

      try {
        const response = await fetch('https://soft-store-bot.vercel.app/api/support', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: webApp.initData,
            category: form.category.value,
            orderId: form.order.value.trim(),
            message: form.message.value.trim(),
          }),
        });

        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || 'Falha ao enviar.');

        showStatus('Atendimento enviado com sucesso. Você receberá a resposta pelo bot.', 'success');
        webApp?.HapticFeedback?.notificationOccurred?.('success');
        form.reset();
        count.textContent = '0';
        setTimeout(() => webApp?.close(), 1300);
      } catch (error) {
        showStatus(error.message || 'Não foi possível enviar. Tente novamente.', 'error');
        webApp?.HapticFeedback?.notificationOccurred?.('error');
        submit.disabled = false;
        submit.textContent = 'TENTAR NOVAMENTE';
      }
    });
  </script>
</body>
</html>
